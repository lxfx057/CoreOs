name: Static checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check coreos-experience.js
      - run: node --check coreos-sandbox.js
      - run: node --check coreos-v6-apps.js
      - run: node --check coreos-v6.js
