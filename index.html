<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <meta name="description" content="CoreOS — crea e personalizza il tuo ambiente desktop.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>CoreOS Desktop</title>
</head>
<body>
  <div id="accountGate" class="account-gate" aria-live="polite"></div>
  <div id="shutdownScreen" class="shutdown-screen" hidden></div>
  <div class="desktop">
    <header class="topbar">
      <nav class="top-left">
        <button class="top-menu-button" id="homeBtn" aria-label="Workspace">Workspaces</button>
        <button class="top-menu-button" id="startButton" type="button">Applications</button>
      </nav>
      <div class="top-center" id="topDate">30 October, 3:49 pm</div>
      <div class="top-right">
        <span class="top-user" id="topUser">au</span>
        <button class="top-system-icon" id="quickSettings" aria-label="Impostazioni rapide">▣</button>
        <span class="top-system-icon">◖</span><span class="top-system-icon">▤</span><span class="top-system-icon">◉</span><span class="top-system-icon">⏻</span>
        <span id="clock">--:--</span>
      </div>
    </header>

    <main class="workspace">
      <section class="desktop-shortcuts" aria-label="Applicazioni sul desktop">
        <button class="desktop-shortcut" data-open="files"><span class="desktop-app-icon folder-icon">▰</span><b>Files</b></button>
        <button class="desktop-shortcut" data-open="notes"><span class="desktop-app-icon text-icon">▤</span><b>Text Editor</b></button>
        <button class="desktop-shortcut" data-open="terminal"><span class="desktop-app-icon terminal-icon">›_</span><b>Terminal</b></button>
        <button class="desktop-shortcut" data-open="settings"><span class="desktop-app-icon settings-icon">⚙</span><b>Settings</b></button>
        <button class="desktop-shortcut" data-open="calculator"><span class="desktop-app-icon calc-icon">◉</span><b>Calculator</b></button>
        <button class="desktop-shortcut" data-open="calendar"><span class="desktop-app-icon calendar-icon">▦</span><b>Calendar</b></button>
      </section>
    </main>

    <nav class="dock" aria-label="Dock applicazioni">
      <button class="dock-app" data-open="apps" aria-label="Applicazioni"><span class="dock-symbol">▦</span></button>
      <span class="dock-divider"></span>
      <button class="dock-app" data-open="files" aria-label="File"><span>▤</span></button>
      <button class="dock-app" data-open="terminal" aria-label="Terminale"><span>›_</span></button>
      <button class="dock-app" data-open="notes" aria-label="Blocco note"><span>▤</span></button>
      <button class="dock-app" data-open="calculator" aria-label="Calcolatrice"><span>＋</span></button>
      <button class="dock-app" data-open="monitor" aria-label="Monitor"><span>◫</span></button>
      <button class="dock-app" data-open="settings" aria-label="Impostazioni"><span>⚙</span></button>
    </nav>
  </div>


  <section class="cosmic-launcher" id="cosmicLauncher" aria-label="Applications" hidden>
    <div class="launcher-search-wrap"><span>⌕</span><input id="launcherSearch" type="search" placeholder="Type to search apps..." autocomplete="off"></div>
    <div class="launcher-apps" id="launcherApps">
      <button class="launcher-app" data-open="files" data-label="COSMIC Files"><span class="launcher-icon folder">▰</span><span>COSMIC Files</span></button>
      <button class="launcher-app" data-open="monitor" data-label="COSMIC Media Player"><span class="launcher-icon media">▶</span><span>COSMIC Media Player</span></button>
      <button class="launcher-app" data-open="settings" data-label="COSMIC Settings"><span class="launcher-icon settings">◉</span><span>COSMIC Settings</span></button>
      <button class="launcher-app" data-open="apps" data-label="COSMIC Store"><span class="launcher-icon store">⬇</span><span>COSMIC Store</span></button>
      <button class="launcher-app" data-open="terminal" data-label="COSMIC Terminal"><span class="launcher-icon terminal">›_</span><span>COSMIC Terminal</span></button>
      <button class="launcher-app" data-open="notes" data-label="COSMIC Text Editor"><span class="launcher-icon editor">▤</span><span>COSMIC Text Editor</span></button>
      <button class="launcher-app" data-open="browser" data-label="Firefox"><span class="launcher-icon firefox">◉</span><span>Firefox</span></button>
      <button class="launcher-app" data-open="settings" data-label="Input Method Selector"><span class="launcher-icon globe">🌐</span><span>Input Method Selector</span></button>
      <button class="launcher-app" data-open="monitor" data-label="Rhythmbox"><span class="launcher-icon music">●</span><span>Rhythmbox</span></button>
      <button class="launcher-app" data-open="calendar" data-label="Thunderbird"><span class="launcher-icon mail">✉</span><span>Thunderbird</span></button>
      <button class="launcher-app" data-open="settings" data-label="nheko"><span class="launcher-icon nheko">N</span><span>nheko</span></button>
    </div>
    <div class="launcher-categories">
      <button class="category-active" data-category="all"><span>⌂</span>Library Home</button>
      <button data-category="office"><span>▰</span>Office</button>
      <button data-category="system"><span>▰</span>System</button>
      <button data-category="utilities"><span>▰</span>Utilities</button>
      <button data-category="add"><span>⊞</span>Add group</button>
    </div>
  </section>
\n  <div class="window-layer" id="windowLayer" aria-live="polite"></div>
  <div class="custom-cursor" id="customCursor" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
